<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - BookHub</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>
    <header>
        <a href="../index.html" class="logo">BookHub</a>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../index.html#libros">Libros</a>
            <a href="quienes-somos.html">¿Quienes somos?</a>
            <a href="inicio-sesion.html">Acceder</a>
            <a href="userpage.html" id="linkPerfil" style="display:none;">Mi Perfil</a>
            <a href="crear-cuenta.html">Registrarse</a>
            <a href="carrito-compras.html">Carrito de Compras</a>
        </nav>
    </header>

    <main class="contenedor-pagina-form" style="flex-direction: column;">
        <div class="tarjeta-formulario" style="max-width: 600px; margin-bottom: 30px;">
            <h2 id="tituloAdmin">Agregar Nuevo Libro</h2>
            <form id="formularioAdmin">
                <input type="hidden" id="libroId">
                <div class="campo-form">
                    <label for="tituloLibro">Título:</label>
                    <input type="text" id="tituloLibro" required>
                </div>
                <div class="campo-form">
                    <label for="autorLibro">Autor:</label>
                    <input type="text" id="autorLibro" required>
                </div>
                <div class="campo-form">
                    <label for="precioLibro">Precio:</label>
                    <input type="number" id="precioLibro" required>
                </div>
                <button type="submit" id="btnGuardarLibro">Guardar Libro</button>
                <button type="button" id="btnCancelarEdicion" style="display:none; background-color: #d9534f;">Cancelar</button>
            </form>
        </div>

        <div class="contenedor-carrito" style="width: 100%; max-width: 800px;">
            <h2 style="margin-bottom: 20px;">Inventario de Libros</h2>
            <div id="lista-inventario">
                <!-- Los libros se generarán aquí -->
            </div>
        </div>
    </main>

    <footer id="footer">
        <p>BookHub© 2026 Todos los derechos reservados</p>
    </footer>

    <script src="../scripts/metodos.js"></script>
</body>
</html>
