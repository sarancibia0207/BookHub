<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Cuenta BookHub</title>
    <link rel="stylesheet" href="../estilos/styles.css">
</head>
<body>
    <header>
            <a href="../index.html" class="logo">BookHub</a>

            <nav>
                <a href="../index.html">Inicio</a>
                <a href="../index.html#libros">Libros</a>
                <a href="../index.html#quienes-somos">¿Quiénes somos?</a>
                <a href="inicio-sesion.html">Acceder</a>
                <a href="crear-cuenta.html">Registrarse</a>
            </nav>
    </header>

    <main class="contenedor-pagina-form">
            <div class="tarjeta-formulario">
                <h1>Creación de Cuenta</h1>
                <p>Regístrate para pedir libros prestados</p>

                <form id="formularioCuenta">
                    <div class="campo-form">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" placeholder="Ej. Carlos Ruiz" required>
                    </div>

                    <div class="campo-form">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="campo-form">
                        <label for="libro">Género literario favorito:</label>
                        <input type="text" id="libro" placeholder="Ej. Ciencia Ficción, Terror..." required>
                    </div>

                    <div class="campo-form">
                        <label for="clave">Contraseña:</label>
                        <input type="password" id="clave" placeholder="Crea una contraseña" required>
                    </div>

                    <button type="submit">Crear mi cuenta</button>
                </form>
            </div>
        </main>

        <footer id="footer">
            <p>Nuestras redes sociales</p>
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ee/Logo_de_Facebook.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" width="100" height="80" alt="BookHub Logo">
            <img src="https://unblast.com/wp-content/uploads/2025/07/instagram-logo-colored.jpg" width="100" height="80" alt="BookHub Logo">
            <img src="" alt="">
            <p>BookHub© 2026 Todos los derechos reservados</p>
        </footer>

        <script src="../scripts/metodos.js"></script>
</body>
</html>
