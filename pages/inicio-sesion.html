<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="estilos/styles.css">
</head>
<body >
    <header>
        <a href="index.html" class="logo">BookHub</a>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="#libros">Libros</a>
            <a href="#quienes-somos">¿Quienes somos?</a>
            <a href="pages/inicio-sesion.html">Acceder</a>
            <a href="pages/crear-cuenta.html">Registrarse</a>
        </nav>
    </header>

    <div class="formulario">
        <h2>Inicio de Sesión</h2>
        <p>Únete a nuestra biblioteca virtual</p>

        <form id="formularioRegistro">

            <div id="grupo-input">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej. Ana Pérez" required>
            </div>
            <div id="grupo-input">
                <label for="email">Correo Electrónico:</label>
                <input type="text" id="email" placeholder="tu@correo.com" required>
            </div>
            <div class="grupo-input">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Crea una contraseña segura" required>
            </div>

            <button type="submit">Registrarme</button>
        </form>
    </div>

    <footer id="footer">
        <p>Nuestras redes sociales</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/ee/Logo_de_Facebook.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original" width="100" height="80" alt="BookHub Logo">
        <img src="https://unblast.com/wp-content/uploads/2025/07/instagram-logo-colored.jpg" width="100" height="80" alt="BookHub Logo">
        <img src="" alt="">
        <p>BookHub© 2026 Todos los derechos reservados</p>
    </footer>

    <script src="metodos.js"></script>
</body>
</html>
